<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeNest — one account, two identities. Social learning on Nest Feed, bias-free code review on Nest Shadow." />
    <title>CodeNest</title>
    <!-- Early theme detector script — prevents page flicker (white/dark flash) on boot -->
    <script>
      (function() {
        try {
          var key = 'cn_feed_theme';
          var saved = localStorage.getItem(key);
          var theme = saved;
          if (!saved || (saved !== 'light' && saved !== 'dark')) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.add('theme-feed');
          if (theme === 'dark') {
            root.classList.add('dark-mode');
          } else {
            root.classList.remove('dark-mode');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
